<template>
    <lightning-card title="Top 3 Accounts (Umsatz)" icon-name="standard:account">
        <div class="slds-p-around_medium">

            <!-- Ladezustand -->
            <template if:true={isLoading}>
                <div class="slds-align_absolute-center slds-p-large">
                    <lightning-spinner alternative-text="Loading"></lightning-spinner>
                </div>
            </template>

            <!-- Fehlerzustand -->
            <template if:true={error}>
                <div class="slds-align_absolute-center slds-p-large">
                    <p class="slds-text-color_error">Fehler beim Laden der Daten</p>
                </div>
            </template>

            <!-- Daten oder Empty State -->
            <template if:false={isLoading}>
                <!-- Empty State: keine Accounts mit Umsatz -->
                <template if:true={isEmpty}>
                    <div class="slds-align_absolute-center slds-p-large">
                        <p class="slds-text-body_medium">{emptyStateMessage}</p>
                    </div>
                </template>

                <!-- Top 3 Accounts Tabelle -->
                <template if:false={isEmpty}>
                    <lightning-datatable
                        key-field="rank"
                        data={accounts}
                        columns={columns}
                        hide-checkbox-columns
                        show-row-number-column
                        row-number-offset="1"
                    ></lightning-datatable>
                </template>
            </template>

        </div>
    </lightning-card>
</template>
