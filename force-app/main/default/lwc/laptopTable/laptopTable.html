<template>
    <div class="slds-m-bottom_medium">
        <h2 class="slds-text-heading_medium slds-m-bottom_small">
            {title}
        </h2>
        <lightning-datatable
            key-field={keyField}
            data={paginatedData}
            columns={columns}
            hide-checkbox-columns
            show-row-number-column
            onsort={handleSort}
        ></lightning-datatable>
        <!-- Pagination -->
        <div class="slds-grid slds-grid_align-spread slds-m-top_small">
            <lightning-button
                label="Zurück"
                onclick={handlePrevious}
                disabled={hasPrevious}
            ></lightning-button>
            <span class="slds-m-horizontal_small">
                Seite {currentPage} von {totalPages}
            </span>
            <lightning-button
                label="Weiter"
                onclick={handleNext}
                disabled={hasNext}
            ></lightning-button>
        </div>
    </div>
</template>
