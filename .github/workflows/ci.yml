name: CI

# The gates AGENTS.md names before a merge: metadata validation, Apex tests,
# and the Playwright session smoke test. The full E2E suite is deliberately NOT
# run here — it currently fails on metadata that is not deployed to Test-Org,
# and a permanently red pipeline is worse than none. Add it once it is green.

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  # Erlaubt einen Lauf per Knopfdruck (Actions-Tab oder `gh workflow run CI`),
  # um das Gate zu pruefen, ohne dafuer committen zu muessen
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------- advisory
  static:
    name: Lint & Format (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Both currently report pre-existing debt (11 lint errors, ~194 files
      # unformatted, mostly under force-app/). Kept non-blocking so the debt is
      # visible without blocking every PR. Flip continue-on-error to false once
      # the backlog is cleared.
      - name: ESLint
        continue-on-error: true
        run: npm run lint

      - name: Prettier
        continue-on-error: true
        run: npm run prettier:verify

  # ------------------------------------------------------------- merge gate
  org:
    name: Metadata, Apex & Session Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SFDX_AUTH_URL: ${{ secrets.SFDX_AUTH_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check for org credentials
        id: guard
        run: |
          if [ -z "$SFDX_AUTH_URL" ]; then
            echo "has_auth=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Org checks skipped::Repository secret SFDX_AUTH_URL is not set. Metadata validation, Apex tests and the session smoke test did not run. See .github/workflows/README.md."
          else
            echo "has_auth=true" >> "$GITHUB_OUTPUT"
          fi

      - run: npm ci
        if: steps.guard.outputs.has_auth == 'true'

      - name: Install Salesforce CLI
        if: steps.guard.outputs.has_auth == 'true'
        run: npm install --global @salesforce/cli@2

      - name: Authenticate to Test-Org
        if: steps.guard.outputs.has_auth == 'true'
        run: |
          printf '%s' "$SFDX_AUTH_URL" > "$RUNNER_TEMP/sfdx-auth.txt"
          sf org login sfdx-url --sfdx-url-file "$RUNNER_TEMP/sfdx-auth.txt" \
            --set-default --alias Test-Org
          rm -f "$RUNNER_TEMP/sfdx-auth.txt"

      # Gate 1 — Apex tests must pass. `sf apex run test` reports coverage but
      # does not enforce a threshold, which is what we want here: the suite is
      # green today (15/15) while overall coverage is still 37%.
      - name: Run Apex tests
        if: steps.guard.outputs.has_auth == 'true'
        run: |
          sf apex run test \
            --test-level RunLocalTests \
            --code-coverage \
            --result-format human \
            --output-dir apex-test-results \
            --wait 30

      # Advisory — a full check-only deploy. Currently blocked by Salesforce's
      # 75% coverage requirement (org-wide coverage is 37%, and
      # CasePriorityTrigger has no test class at all). Flip
      # continue-on-error to false once coverage clears 75% — from then on this
      # is the honest pre-deploy gate, because production deployments enforce
      # exactly this threshold.
      - name: Validate metadata (check-only, advisory)
        if: steps.guard.outputs.has_auth == 'true'
        continue-on-error: true
        run: |
          sf project deploy validate \
            --source-dir force-app \
            --test-level RunLocalTests \
            --wait 30

      # Gate 3 — proves the Playwright auth layer still works against this org
      - name: Install Chromium
        if: steps.guard.outputs.has_auth == 'true'
        run: npx playwright install --with-deps chromium

      - name: Playwright session smoke
        if: steps.guard.outputs.has_auth == 'true'
        run: npm run test:e2e:smoke

      # AGENTS.md requires the HTML report as a CI artifact, never committed
      - name: Upload Playwright report
        if: always() && steps.guard.outputs.has_auth == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload Apex test results
        if: always() && steps.guard.outputs.has_auth == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: apex-test-results
          path: apex-test-results/
          retention-days: 14
          if-no-files-found: ignore

  prod-drift:
    name: Prod-Org Drift Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SFDX_AUTH_URL_PROD: ${{ secrets.SFDX_AUTH_URL_PROD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Skips cleanly when the secret is absent, exactly like the org job.
      - name: Check for Prod-Org credentials
        id: guard
        run: |
          if [ -z "$SFDX_AUTH_URL_PROD" ]; then
            echo "has_auth=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Prod drift gate skipped::Repository secret SFDX_AUTH_URL_PROD is not set."
          else
            echo "has_auth=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Salesforce CLI
        if: steps.guard.outputs.has_auth == 'true'
        run: npm install --global @salesforce/cli@2

      - name: Authenticate to Prod-Org
        if: steps.guard.outputs.has_auth == 'true'
        run: |
          printf '%s' "$SFDX_AUTH_URL_PROD" > "$RUNNER_TEMP/prod-auth.txt"
          sf org login sfdx-url --sfdx-url-file "$RUNNER_TEMP/prod-auth.txt" --alias Prod-Org
          rm -f "$RUNNER_TEMP/prod-auth.txt"

      # Check-only. Changes nothing in Prod-Org.
      #
      # Salesforce validates COMPONENTS before it runs tests, so a reference to
      # metadata that exists only in Test-Org surfaces here even though the test
      # phase would later fail on the 37% org-wide coverage. That is why this
      # step gates on component errors ONLY and treats test/coverage problems
      # as a warning — otherwise the 75% production threshold would keep the
      # gate permanently red and useless.
      #
      # Two further distinctions, both learned from run 33994254498:
      #   - Pending scheduled/async Apex jobs also block a Prod validation.
      #     They are a property of the org, not of the pull request, so they
      #     are printed as a warning and do not fail the job.
      #   - A result the parser cannot read is a FAILURE, never a pass. The
      #     first version read only result.details.componentFailures and
      #     reported success on a run that had found 62 component errors,
      #     because that shape carries them in "message" instead.
      #
      # The failure class this catches, three times so far:
      #   SCRUM-315/384/386  FeedItem.RypplePost quick action  (Test-Org only)
      #   SCRUM-390          Case.RueckrufGewuenscht__c        (Test-Org only)
      #   SCRUM-390          Case.RueckrufTermin__c            (Test-Org only)
      # Each was found at release time by DevOps, hours after the code was
      # written, and cost a full round trip back to Implementierung.
      - name: Validate against Prod-Org (check-only)
        if: steps.guard.outputs.has_auth == 'true'
        run: |
          set +e
          sf project deploy validate --source-dir force-app \
            --target-org Prod-Org --test-level RunLocalTests \
            --wait 30 --json > prod-validate.json
          set -e
          python3 - <<'EOF'
          import json, re, sys

          try:
              d = json.load(open("prod-validate.json"))
          except Exception as e:
              print(f"::error title=Prod drift gate::prod-validate.json is not readable JSON: {e}")
              sys.exit(1)

          # The CLI answers in two different shapes. A completed validation puts its
          # findings under "result". Some failure classes (FailedValidationError, seen
          # on run 33994254498) return a bare error object instead, with the findings
          # only inside "message". Reading just the first shape reported a green gate
          # on a run that had found 62 component errors.
          befunde = []
          r = d.get("result") or {}
          roh = (r.get("details") or {}).get("componentFailures") or []
          if isinstance(roh, dict):
              roh = [roh]
          for f in roh:
              befunde.append((f.get("fullName", "?"), (f.get("problem") or "").strip()))

          if not befunde:
              for zeile in (d.get("message") or "").split("\n"):
                  m = re.match(r"\s*Error in (.+?) - (.*)", zeile)
                  if m:
                      befunde.append((m.group(1).strip(), m.group(2).strip()))

          befunde = list(dict.fromkeys(befunde))

          # Pending scheduled or async Apex jobs block a validation in Prod-Org, but they
          # say nothing about this pull request. Reported, never gated.
          JOBTEXTE = ("jobs pending or in progress",
                      "allowing deployments with Apex jobs",
                      "asynchronous Apex jobs")
          def ist_jobblocker(problem):
              return any(t in problem for t in JOBTEXTE)

          apex  = [b for b in befunde if ist_jobblocker(b[1])]
          drift = [b for b in befunde if not ist_jobblocker(b[1])]

          # A gate that cannot read its own result must not wave the change through.
          if not befunde and not r:
              print("::error title=Prod drift gate::Validation produced no usable result — "
                    "this run cannot show the change is free of drift.")
              print(f"  name: {d.get('name', '?')}   code: {d.get('code', '?')}")
              print("  " + (d.get("message") or "(no message)")[:800].replace("\n", "\n  "))
              sys.exit(1)

          if apex:
              klassen = sorted({n for n, _ in apex})
              print(f"::warning title=Prod-Org has pending Apex jobs::{len(klassen)} class(es) "
                    f"have scheduled or async jobs pending. This blocks the deployment itself, "
                    f"not this PR. Enable 'Allow deployments of components when corresponding "
                    f"Apex jobs are pending or in progress' in Setup > Deployment Settings.")
              print(f"  {', '.join(klassen)}")

          if drift:
              print(f"::error title=Prod-Org drift::{len(drift)} component(s) do not resolve in Prod-Org")
              for name, problem in drift[:40]:
                  print(f"  {name}: {problem[:200]}")
              if len(drift) > 40:
                  print(f"  … and {len(drift) - 40} more")
              sys.exit(1)

          # Cross-check: Salesforce prints its own total. If it exceeds what we
          # parsed, say so rather than quietly reporting less than actually failed.
          #
          # One caveat, measured: that total runs exactly one higher than the
          # number of "Error in ..." lines Salesforce itself prints — run
          # 33994254498 said 62 and printed 61, run 34004632932 said 58 and
          # printed 57, neither with a duplicate line. A gap of one is that
          # quirk. Only a wider gap means findings were genuinely missed.
          m = re.search(r"(\d+) component error\(s\)", d.get("message") or "")
          if m:
              gemeldet, gelesen = int(m.group(1)), len(befunde)
              if gemeldet - gelesen > 1:
                  print(f"::error title=Prod drift gate::Salesforce reports {gemeldet} "
                        f"component error(s) but only {gelesen} line(s) could be parsed.")
                  sys.exit(1)

          print(f"No component drift. Deploy status: {r.get('status', d.get('status', '?'))}")
          nt = (r.get("numberTestErrors") or 0)
          if nt:
              print(f"::warning title=Prod test phase::{nt} test failure(s) — not gated here, "
                    f"org-wide coverage is below the 75% production threshold.")
          EOF

      - name: Upload validate result
        if: always() && steps.guard.outputs.has_auth == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: prod-validate
          path: prod-validate.json
          retention-days: 14
          if-no-files-found: ignore
