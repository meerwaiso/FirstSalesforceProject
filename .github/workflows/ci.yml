name: CI

# The gates AGENTS.md names before a merge: metadata validation, Apex tests,
# and the Playwright session smoke test. The full E2E suite is deliberately NOT
# run here — it currently fails on metadata that is not deployed to Test-Org,
# and a permanently red pipeline is worse than none. Add it once it is green.

on:
  pull_request:
    branches: [master]
  # Kein eigener Lauf nach dem Merge auf master (seit 16.10.2026, Wunsch von @user):
  # jede Aenderung ist im Pull Request schon geprueft. Fuer eine Nachpruefung von master
  # bleibt workflow_dispatch unten.
  # Erlaubt einen Lauf per Knopfdruck (Actions-Tab oder `gh workflow run CI`),
  # um das Gate zu pruefen, ohne dafuer committen zu muessen
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------- advisory
  static:
    name: Lint & Format (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Both currently report pre-existing debt (11 lint errors, ~194 files
      # unformatted, mostly under force-app/). Kept non-blocking so the debt is
      # visible without blocking every PR. Flip continue-on-error to false once
      # the backlog is cleared.
      - name: ESLint
        continue-on-error: true
        run: npm run lint

      - name: Prettier
        continue-on-error: true
        run: npm run prettier:verify

  # ------------------------------------------------------------- merge gate
  readme:
    name: README aus Release Notes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Blockierend, im Gegensatz zum advisory static-Job. README.md ist die
    # Startseite und wird aus docs/RELEASE-NOTES.md erzeugt; laufen die zwei
    # auseinander, zeigt GitHub veraltete Release Notes, ohne dass es auffaellt.
    steps:
      - uses: actions/checkout@v4
      - name: README ist aktuell?
        run: scripts/build-readme.sh --check

  org:
    name: Metadata, Apex & Session Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Salesforce runs at most ONE broad Apex test run per org at a time. A
    # second one is refused — sometimes as ALREADY_IN_PROCESS, sometimes as a
    # bare UNKNOWN_EXCEPTION that aborts in two seconds with no test results.
    # The workflow-level group above is per-ref, so two branches could reach
    # Test-Org at the same moment; on 2026-09-06 a master run and a PR run
    # started 23 seconds apart and collided.
    #
    # This group is deliberately NOT ref-scoped and does NOT cancel: a second
    # run waits for the first instead of being refused. It serialises CI
    # against CI. It cannot serialise CI against an agent deploying from a
    # terminal — see the AGENTS.md guardrail on test levels for that half.
    concurrency:
      group: apex-test-org
      cancel-in-progress: false
    env:
      SFDX_AUTH_URL: ${{ secrets.SFDX_AUTH_URL }}
    steps:
      # Full history: the scope step below diffs against the base to find out
      # whether any deployable metadata changed at all. A shallow clone cannot.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check for org credentials
        id: guard
        run: |
          if [ -z "$SFDX_AUTH_URL" ]; then
            echo "has_auth=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Org checks skipped::Repository secret SFDX_AUTH_URL is not set. Metadata validation, Apex tests and the session smoke test did not run. See .github/workflows/README.md."
          else
            echo "has_auth=true" >> "$GITHUB_OUTPUT"
          fi

      - run: npm ci
        if: steps.guard.outputs.has_auth == 'true'

      - name: Install Salesforce CLI
        if: steps.guard.outputs.has_auth == 'true'
        run: npm install --global @salesforce/cli@2

      - name: Authenticate to Test-Org
        if: steps.guard.outputs.has_auth == 'true'
        run: |
          printf '%s' "$SFDX_AUTH_URL" > "$RUNNER_TEMP/sfdx-auth.txt"
          sf org login sfdx-url --sfdx-url-file "$RUNNER_TEMP/sfdx-auth.txt" \
            --set-default --alias Test-Org
          rm -f "$RUNNER_TEMP/sfdx-auth.txt"

      # Apex test scope — a quota decision, not a thoroughness decision.
      #
      # The org accepts max(500, 10 x test classes) ApexTestQueueItem rows per
      # ROLLING 24 h. With 26 test classes the floor of 500 applies, and every
      # test class in a run costs one row. Gate 1 plus the advisory validate
      # below spent ~52 rows per CI run — about nine runs a day for five agents,
      # CI and manual runs together. On 2026-09-07 the budget was gone by 19:16
      # and every Apex run in the org then failed with a bare UNKNOWN_EXCEPTION
      # that names neither tests nor the budget.
      #
      # So a branch runs only its own ticket's tests, master runs everything.
      # Test classes are named SCRUM<nnn>...Test, so the ticket in the branch
      # name selects them. No ticket in the name, no matching class, or master:
      # fall back to the full run. Spending budget beats skipping tests silently.
      #
      # The branch name reaches the script through the environment, never by
      # ${{ }} interpolation: git permits $, backticks, parentheses and ';' in
      # ref names, so an interpolated name would be executable text.
      - name: Determine Apex test scope
        if: steps.guard.outputs.has_auth == 'true'
        id: scope
        env:
          ZWEIG: ${{ github.head_ref || github.ref_name }}
          BASIS: ${{ github.base_ref }}
          VORHER: ${{ github.event.before }}
        run: |
          # Nothing deployable changed? Then there is nothing to test. A pull
          # request touching only AGENTS.md spent 52 rows of the budget on
          # 2026-09-07 and hung on a red Apex gate it could not have caused.
          # An empty diff means "could not determine" — then we do NOT skip.
          geaendert=""
          if [ -n "$BASIS" ]; then
            geaendert=$(git diff --name-only "origin/$BASIS...HEAD" 2>/dev/null || true)
          elif [ -n "$VORHER" ] && [ "$VORHER" != "0000000000000000000000000000000000000000" ]; then
            geaendert=$(git diff --name-only "$VORHER" HEAD 2>/dev/null || true)
          fi
          if [ -n "$geaendert" ] && ! printf '%s\n' "$geaendert" | grep -q '^force-app/'; then
            echo "level=NoTests" >> "$GITHUB_OUTPUT"
            echo "classes=" >> "$GITHUB_OUTPUT"
            echo "::notice title=Apex test scope::NoTests — nothing under force-app/ changed"
            exit 0
          fi

          # Which tickets does this run carry? The branch name is one source and
          # not a trustworthy one on its own: PR #67 was named after SCRUM-398
          # and shipped SCRUM-396 in the same branch, so a branch-name-only
          # selection would have left half of it untested — green meaning
          # nothing. The changed paths are the second source, and they cannot
          # lie about what is in the diff. Union of both, never one alone.
          klassen=""
          if [ "$ZWEIG" != "master" ]; then
            tickets=$( { printf '%s\n' "$ZWEIG"; printf '%s\n' "$geaendert"; } \
              | grep -oE 'SCRUM-?[0-9]+' | tr -d '-' | sort -u )
            if [ -n "$tickets" ]; then
              muster=$(printf '%s\n' "$tickets" | paste -sd'|' -)
              klassen=$(ls force-app/main/default/classes/ \
                | grep -E "^(${muster})[A-Za-z0-9_]*Test\.cls$" \
                | sed 's/\.cls$//' \
                | paste -sd, -)
            fi
          fi
          if [ -n "$klassen" ]; then
            echo "level=RunSpecifiedTests" >> "$GITHUB_OUTPUT"
            echo "classes=$klassen" >> "$GITHUB_OUTPUT"
            echo "::notice title=Apex test scope::RunSpecifiedTests — $klassen"
          else
            echo "level=RunAllTestsInOrg" >> "$GITHUB_OUTPUT"
            echo "classes=" >> "$GITHUB_OUTPUT"
            echo "::notice title=Apex test scope::RunAllTestsInOrg (full suite)"
          fi

      # FLS-Gate — blockierend, und ZWANGSLÄUFIG vor "Run Apex tests".
      # Ein Feld ohne wirksame FLS ist für alle unsichtbar, und SOQL wie Apex
      # melden darauf "No such column" / "fields being inaccessible" — von
      # einem fehlenden Feld nicht unterscheidbar. Lief das Gate NACH den
      # Apex-Tests, starb der Lauf am rohen Symptom und der Gate-Text, der den
      # fehlenden Permission-Set-Namen mit "niemandem zugewiesen" benennen
      # würde, kam nie dran. SCRUM-434 (2026-09-28): 1,5 h Propagations-Lag-
      # Verfolgung, Ursache war ein nicht zugewiesenes PS. SCRUM-382, 386,
      # 388, 390, 398 und 421 haben das gleiche Muster schon bezahlt.
      - name: FLS gate (fields need a granting AND assigned Permission Set)
        if: steps.guard.outputs.has_auth == 'true'
        env:
          # Drei Ereignisse, drei richtige Basen. workflow_dispatch lief bisher
          # gegen HEAD~1: auf einem Feature-Branch ist der Feldverlauf dann leer,
          # das Gate meldet "nichts zu prüfen" und der Lauf wird grün, ohne
          # geprüft zu haben. Gemessen am 24.09.2026, Commit 0046ee5: Lauf
          # 36055535706 (pull_request) rot, Lauf 36055570102 (dispatch) grün.
          BASIS: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || (github.event_name == 'workflow_dispatch' && 'origin/master' || 'HEAD~1') }}
        run: python3 scripts/fls-gate.py --base "$BASIS" --org Test-Org

      # Gate 1 — Apex tests must pass. `sf apex run test` reports coverage but
      # does not enforce a threshold, which is what we want here: the suite is
      # green today (15/15) while overall coverage is still 37%.
      #
      # TEST-LEVEL: set by the step above. RunAllTestsInOrg is the same broad
      # path as `RunLocalTests` without `--class-names` — the explicit spelling,
      # kept so a runner flake can be read directly as such (the BUG-A repro was
      # on this path; named runs green).
      # See Jira SCRUM-394 comment 16496 for the full BUG-A context.
      - name: Run Apex tests
        if: steps.guard.outputs.has_auth == 'true' && steps.scope.outputs.level != 'NoTests'
        env:
          STUFE: ${{ steps.scope.outputs.level }}
          KLASSEN: ${{ steps.scope.outputs.classes }}
        run: |
          if [ "$STUFE" = "RunSpecifiedTests" ]; then
            sf apex run test \
              --test-level RunSpecifiedTests \
              --class-names "$KLASSEN" \
              --code-coverage \
              --result-format human \
              --output-dir apex-test-results \
              --wait 30
          else
            sf apex run test \
              --test-level RunAllTestsInOrg \
              --code-coverage \
              --result-format human \
              --output-dir apex-test-results \
              --wait 30
          fi

      # Advisory — a full check-only deploy. Currently blocked by Salesforce's
      # 75% coverage requirement (org-wide coverage is 37%, and
      # CasePriorityTrigger has no test class at all). Flip
      # continue-on-error to false once coverage clears 75% — from then on this
      # is the honest pre-deploy gate, because production deployments enforce
      # exactly this threshold.
      - name: Validate metadata (check-only, advisory)
        if: steps.guard.outputs.has_auth == 'true' && steps.scope.outputs.level != 'NoTests'
        continue-on-error: true
        env:
          STUFE: ${{ steps.scope.outputs.level }}
          KLASSEN: ${{ steps.scope.outputs.classes }}
        run: |
          if [ "$STUFE" = "RunSpecifiedTests" ]; then
            sf project deploy validate \
              --source-dir force-app \
              --test-level RunSpecifiedTests \
              --tests "$KLASSEN" \
              --wait 30
          else
            sf project deploy validate \
              --source-dir force-app \
              --test-level RunLocalTests \
              --wait 30
          fi

      # Gate 3 — proves the Playwright auth layer still works against this org
      - name: Install Chromium
        if: steps.guard.outputs.has_auth == 'true'
        run: npx playwright install --with-deps chromium

      - name: Playwright session smoke
        if: steps.guard.outputs.has_auth == 'true'
        run: npm run test:e2e:smoke

      # AGENTS.md requires the HTML report as a CI artifact, never committed
      - name: Upload Playwright report
        if: always() && steps.guard.outputs.has_auth == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload Apex test results
        if: always() && steps.guard.outputs.has_auth == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: apex-test-results
          path: apex-test-results/
          retention-days: 14
          if-no-files-found: ignore

  prod-drift:
    name: Prod-Org Drift Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SFDX_AUTH_URL_PROD: ${{ secrets.SFDX_AUTH_URL_PROD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Skips cleanly when the secret is absent, exactly like the org job.
      - name: Check for Prod-Org credentials
        id: guard
        run: |
          if [ -z "$SFDX_AUTH_URL_PROD" ]; then
            echo "has_auth=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Prod drift gate skipped::Repository secret SFDX_AUTH_URL_PROD is not set."
          else
            echo "has_auth=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Salesforce CLI
        if: steps.guard.outputs.has_auth == 'true'
        run: npm install --global @salesforce/cli@2

      - name: Authenticate to Prod-Org
        if: steps.guard.outputs.has_auth == 'true'
        run: |
          printf '%s' "$SFDX_AUTH_URL_PROD" > "$RUNNER_TEMP/prod-auth.txt"
          sf org login sfdx-url --sfdx-url-file "$RUNNER_TEMP/prod-auth.txt" --alias Prod-Org
          rm -f "$RUNNER_TEMP/prod-auth.txt"

      # Check-only. Changes nothing in Prod-Org.
      #
      # Salesforce validates COMPONENTS before it runs tests, so a reference to
      # metadata that exists only in Test-Org surfaces here even though the test
      # phase would later fail on the 37% org-wide coverage. That is why this
      # step gates on component errors ONLY and treats test/coverage problems
      # as a warning — otherwise the 75% production threshold would keep the
      # gate permanently red and useless.
      #
      # Two further distinctions, both learned from run 33994254498:
      #   - Pending scheduled/async Apex jobs also block a Prod validation.
      #     They are a property of the org, not of the pull request, so they
      #     are printed as a warning and do not fail the job.
      #   - A result the parser cannot read is a FAILURE, never a pass. The
      #     first version read only result.details.componentFailures and
      #     reported success on a run that had found 62 component errors,
      #     because that shape carries them in "message" instead.
      #
      # The failure class this catches, three times so far:
      #   SCRUM-315/384/386  FeedItem.RypplePost quick action  (Test-Org only)
      #   SCRUM-390          Case.RueckrufGewuenscht__c        (Test-Org only)
      #   SCRUM-390          Case.RueckrufTermin__c            (Test-Org only)
      # Each was found at release time by DevOps, hours after the code was
      # written, and cost a full round trip back to Implementierung.
      - name: Validate against Prod-Org (check-only)
        if: steps.guard.outputs.has_auth == 'true'
        run: |
          set +e
          sf project deploy validate --source-dir force-app \
            --target-org Prod-Org --test-level RunLocalTests \
            --wait 30 --json > prod-validate.json
          set -e
          python3 - <<'EOF'
          import json, re, sys

          try:
              d = json.load(open("prod-validate.json"))
          except Exception as e:
              print(f"::error title=Prod drift gate::prod-validate.json is not readable JSON: {e}")
              sys.exit(1)

          # The CLI answers in two different shapes. A completed validation puts its
          # findings under "result". Some failure classes (FailedValidationError, seen
          # on run 33994254498) return a bare error object instead, with the findings
          # only inside "message". Reading just the first shape reported a green gate
          # on a run that had found 62 component errors.
          befunde = []
          r = d.get("result") or {}
          roh = (r.get("details") or {}).get("componentFailures") or []
          if isinstance(roh, dict):
              roh = [roh]
          for f in roh:
              befunde.append((f.get("fullName", "?"), (f.get("problem") or "").strip()))

          if not befunde:
              for zeile in (d.get("message") or "").split("\n"):
                  m = re.match(r"\s*Error in (.+?) - (.*)", zeile)
                  if m:
                      befunde.append((m.group(1).strip(), m.group(2).strip()))

          befunde = list(dict.fromkeys(befunde))

          # Pending scheduled or async Apex jobs block a validation in Prod-Org, but they
          # say nothing about this pull request. Reported, never gated.
          JOBTEXTE = ("jobs pending or in progress",
                      "allowing deployments with Apex jobs",
                      "asynchronous Apex jobs")
          def ist_jobblocker(problem):
              return any(t in problem for t in JOBTEXTE)

          # A report cannot reference its own report type inside one package:
          # Salesforce does not resolve that dependency during a validation, the
          # type has to be present in the org already. For work that has not
          # been released yet it is not — which is the normal state before a
          # release, not drift. Measured 2026-09-08: report and report type
          # deployed together fail exactly like the report alone.
          #
          # It IS drift when the type is missing from the repo too. The three
          # cases this gate has caught so far were all of that kind, and they
          # still fail here: no file, no exemption.
          import pathlib
          def typ_liegt_im_repo(name, problem):
              if "invalid report type" not in problem.lower():
                  return False
              bericht = pathlib.Path("force-app/main/default/reports") / f"{name}.report-meta.xml"
              if not bericht.is_file():
                  return False
              m = re.search(r"<reportType>([^<]+)</reportType>", bericht.read_text(encoding="utf-8"))
              if not m:
                  return False
              typ = pathlib.Path("force-app/main/default/reporttypes") / f"{m.group(1).strip()}.reportType-meta.xml"
              return typ.is_file()

          apex   = [b for b in befunde if ist_jobblocker(b[1])]
          rest   = [b for b in befunde if not ist_jobblocker(b[1])]
          unveroeffentlicht = [b for b in rest if typ_liegt_im_repo(*b)]
          drift  = [b for b in rest if not typ_liegt_im_repo(*b)]

          # A FailedValidationError whose message lists only failing TESTS is a
          # readable result, not an unreadable one: every component resolved, the
          # test phase failed. This gate treats test problems as a warning (see the
          # comment on the step), so it must not turn red here. Measured: SCRUM-442
          # run 38126905195 and SCRUM-445 artifact 11848153322 both landed in the
          # "no usable result" branch below with 0 component errors and only test
          # failures, and both PRs needed a manual waiver.
          #
          # Shape (one line, entries separated by commas that precede the next
          # "Class.method - System."):  Failed to validate ... Due To:
          #   ClassA.m1 - System.QueryException: ...,ClassB.m2 - System.DmlException: ...
          testfehler = []
          if not befunde and not r:
              text = d.get("message") or ""
              rumpf = text.split("Due To:", 1)[1] if "Due To:" in text else ""
              for teil in re.split(r",(?=\s*[A-Za-z0-9_]+\.[A-Za-z0-9_]+ - System\.)", rumpf):
                  m = re.match(r"\s*([A-Za-z0-9_]+\.[A-Za-z0-9_]+) - (System\.\S+?):?\s(.*)", teil, re.S)
                  if m:
                      testfehler.append((m.group(1), m.group(2), " ".join(m.group(3).split())))

          # Why a test fails in Prod-Org but not in Test-Org. A hint for the reader,
          # never a reason to gate.
          def ursache(meldung):
              if "No such column" in meldung or "fields being inaccessible" in meldung:
                  return "new field not visible to the test user yet (permission sets are assigned at release)"
              if "List has no rows for assignment" in meldung:
                  return "test expects a record or user that exists only in Test-Org"
              if "FIELD_CUSTOM_VALIDATION_EXCEPTION" in meldung:
                  return "older test data violates a new validation rule"
              return "other"

          # Only one cause is expected before a release: a new field the test user
          # cannot see yet, because permission sets are assigned at release time.
          # That is a warning. Every other cause will still fail AFTER the release
          # (SCRUM-445: 6 tests looked up a Test-Org-only user, went red in Prod-Org
          # and became SCRUM-448; SCRUM-442: older test data broke a new validation
          # rule), so those keep the gate red, but with the test names and the cause.
          NEUES_FELD = "new field not visible to the test user yet (permission sets are assigned at release)"
          if testfehler:
              gruppen = {}
              for name, typ, meldung in testfehler:
                  gruppen.setdefault(ursache(meldung), []).append((name, typ, meldung))
              erwartet = gruppen.pop(NEUES_FELD, [])
              echt = sum(len(v) for v in gruppen.values())
              if erwartet:
                  print(f"::warning title=Prod test phase::{len(erwartet)} test(s) cannot see new fields yet "
                        f"— expected before release, not gated.")
                  for name, typ, meldung in erwartet:
                      print(f"    {name}  {typ}: {meldung[:160]}")
              if echt:
                  print(f"::error title=Prod test phase::{echt} test(s) fail in Prod-Org for a reason the "
                        f"release will not fix — they will still fail after deployment.")
                  for grund, liste in gruppen.items():
                      print(f"  {len(liste)}x {grund}:")
                      for name, typ, meldung in liste:
                          print(f"    {name}  {typ}: {meldung[:160]}")
                  sys.exit(1)
              print("No component drift, no test failure beyond the expected pre-release ones.")
              sys.exit(0)

          # A gate that cannot read its own result must not wave the change through.
          if not befunde and not r:
              print("::error title=Prod drift gate::Validation produced no usable result — "
                    "this run cannot show the change is free of drift.")
              print(f"  name: {d.get('name', '?')}   code: {d.get('code', '?')}")
              print("  " + (d.get("message") or "(no message)").replace("\n", "\n  "))
              sys.exit(1)

          if apex:
              klassen = sorted({n for n, _ in apex})
              print(f"::warning title=Prod-Org has pending Apex jobs::{len(klassen)} class(es) "
                    f"have scheduled or async jobs pending. This blocks the deployment itself, "
                    f"not this PR. Enable 'Allow deployments of components when corresponding "
                    f"Apex jobs are pending or in progress' in Setup > Deployment Settings.")
              print(f"  {', '.join(klassen)}")

          if unveroeffentlicht:
              print(f"::warning title=Not yet in Prod-Org::{len(unveroeffentlicht)} report(s) reference a "
                    f"report type that is in this repository but not yet released to Prod-Org. Not drift — "
                    f"the type is deployed with the release, and a validation cannot create it beforehand.")
              for name, problem in unveroeffentlicht:
                  print(f"  {name}: {problem[:200]}")

          if drift:
              print(f"::error title=Prod-Org drift::{len(drift)} component(s) do not resolve in Prod-Org")
              for name, problem in drift[:40]:
                  print(f"  {name}: {problem[:200]}")
              if len(drift) > 40:
                  print(f"  … and {len(drift) - 40} more")
              sys.exit(1)

          # Cross-check: Salesforce prints its own total. If it exceeds what we
          # parsed, say so rather than quietly reporting less than actually failed.
          #
          # One caveat, measured: that total runs exactly one higher than the
          # number of "Error in ..." lines Salesforce itself prints — run
          # 33994254498 said 62 and printed 61, run 34004632932 said 58 and
          # printed 57, neither with a duplicate line. A gap of one is that
          # quirk. Only a wider gap means findings were genuinely missed.
          m = re.search(r"(\d+) component error\(s\)", d.get("message") or "")
          if m:
              gemeldet, gelesen = int(m.group(1)), len(befunde)
              if gemeldet - gelesen > 1:
                  print(f"::error title=Prod drift gate::Salesforce reports {gemeldet} "
                        f"component error(s) but only {gelesen} line(s) could be parsed.")
                  # Measured 2026-09-18 (run 35355363613): gemeldet 110, gelesen 108, drift
                  # empty. The gap came from the job-blocker entries — Salesforce counts them
                  # in its total but does not print them in the "Error in ..." shape this
                  # parser matches. Naming that here keeps the next reader from hunting a
                  # parser bug while the cause sits in the warning above.
                  if apex:
                      print(f"  Likely cause: {len({n for n, _ in apex})} class(es) have "
                            f"pending Apex jobs (see the warning above), not unparsed drift. "
                            f"Enable 'Allow deployments of components when corresponding Apex "
                            f"jobs are pending or in progress' in Setup > Deployment Settings, "
                            f"or abort the jobs before validating.")
                  sys.exit(1)

          print(f"No component drift. Deploy status: {r.get('status', d.get('status', '?'))}")
          nt = (r.get("numberTestErrors") or 0)
          if nt:
              print(f"::warning title=Prod test phase::{nt} test failure(s) — not gated here, "
                    f"org-wide coverage is below the 75% production threshold.")
          EOF

      - name: Upload validate result
        if: always() && steps.guard.outputs.has_auth == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: prod-validate
          path: prod-validate.json
          retention-days: 14
          if-no-files-found: ignore
